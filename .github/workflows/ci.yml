name: ci

# One workflow, because two was the bug.
#
# ci.yml and release.yml both fired on a push to main and were wholly independent, so nothing
# connected them. The release path's entire quality gate was a single `dotnet test`: every release
# shipped without the AOT size and dependency gates, without the installer compile, without
# installer-smoke, and without `dotnet format --verify-no-changes`.
#
# That is not theoretical. Commit ac81774 - "fix(ci): the gate holder waits to be told, and cannot
# fail on the way out" - failed installer-smoke, and the release workflow for the same commit
# published v0.9.0 with six assets anyway. A CI-fixing commit whose own CI was red shipped a public
# release. The release jobs live here now, with `needs:` on the gates, because that is the only
# arrangement in which a red gate can stop a release.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Unchanged, except for the `none` bump: a manual run can now exercise the gates - or the runner
  # canary - without publishing anything.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this manual release'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

  # The cadence runner-canary's comment has claimed since it was written, with no schedule to
  # deliver it. Building an unchanged tree weekly is also the only thing that catches a new 10.0.x
  # SDK or a migrated runner image on its own, rather than on whoever pushes next.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A workflow has one workflow-level block and the two this replaces disagreed: ci cancelled
# superseded runs, release queued and never cancelled, for a reason its comment stated - two rapid
# pushes must not compute the same next tag in parallel and race on creating it.
#
# Resolved by what each is protecting. Cancelling exists so five rapid pushes to a pull request do
# not each hold six runners, so it stays for pull_request. On main it goes off, because a run on
# main may be part-way through creating a tag and uploading five installers, and cancelling that
# leaves a tag pointing at a release that does not exist.
#
# The cost is stated rather than hidden: cancel-in-progress: false QUEUES, it does not parallelise.
# Runs on main now serialise, so a push landing while another is mid-flight waits for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Pinned to windows-2025 rather than windows-latest. The `latest` label migrated to
  # Server 2025 + VS 2026 over 8-15 June 2026, and because our CLI is NativeAOT an image
  # change alters the machine code we actually ship. That should arrive as a reviewed PR,
  # not as a surprise on a Tuesday. The canary job below watches for the next one.
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WinLogRotate.slnx

      - name: Build (Release)
        run: dotnet build WinLogRotate.slnx -c Release --no-restore

      # global.json opts the repo into the Microsoft.Testing.Platform runner. Without that
      # block the .NET 10 SDK refuses to run xunit.v3 projects at all.
      - name: Test
        run: dotnet test WinLogRotate.slnx -c Release --no-build

      - name: Format check
        run: dotnet format WinLogRotate.slnx --verify-no-changes --severity warn

  # Everything except the WinForms project must build and its tests must pass off-Windows.
  # This is not portability for its own sake: it is the standing proof that the engine's
  # platform-neutral half (schedule math, glob matching, retention arithmetic, TOML
  # round-trip) really is neutral, which is what keeps ~70% of the suite fast and what
  # stops [SupportedOSPlatform] creeping onto types that do not need it.
  linux-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # EnableWindowsTargeting lets the WinForms project restore and type-check here too;
      # only the runnable exe needs Windows.
      - name: Build (Release)
        run: dotnet build WinLogRotate.slnx -c Release

      - name: Test (pure suite)
        run: dotnet test tests/WinLogRotate.Core.Tests/WinLogRotate.Core.Tests.csproj -c Release --no-build

  # The job that keeps "zero dependencies" honest. NativeAOT cannot cross-compile to
  # Windows, so this is the only place the CLI is truly linked - a Linux dev box can only
  # ever see the analyzer half of the story.
  aot:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # /warnaserror on the publish, not just the build: a trim/AOT warning here means the
      # published binary will fail at runtime in a way no test will catch, because the
      # failing path is whichever one happens to hit the trimmed-away metadata.
      - name: Publish NativeAOT CLI
        run: >
          dotnet publish src/WinLogRotate.Cli/WinLogRotate.Cli.csproj
          -c Release -r win-x64
          -p:PublishAot=true
          -p:TrimmerSingleWarn=false
          /warnaserror
          -o publish-cli

      # A floor AND a ceiling. The ceiling catches reflection creep - the quiet cost of one
      # convenient JsonSerializer.Deserialize<T>. The floor catches a publish that silently
      # produced a framework-dependent apphost stub instead of a native image, which looks
      # like a wonderful size win right up until it fails on a machine with no runtime.
      #
      # 16 MB against a binary currently measuring 11.34, which is deliberate slack rather than
      # a number fitted to today's build. It was 12 until milestone 10 added notification
      # delivery and took this from 10.05 to 11.34; System.Net.Mail was the only new framework
      # assembly - HttpClient and System.Text.Json were already in the image - and it added no
      # new DLL import at all, so the dependency gate below was unaffected.
      #
      # Sized for what the gate is FOR. Reflection creep under NativeAOT is not a slow drift:
      # one reflection-based serializer on a reachable path makes ILC retain whole type graphs
      # plus the metadata to walk them, and the image jumps by megabytes at once. A ceiling with
      # ~40% headroom still fails loudly on that while surviving several milestones of honest
      # growth - and a gate nobody has to raise is a gate nobody learns to raise reflexively,
      # which is the failure mode that turns a canary into decoration.
      #
      # What it does NOT catch, and this is the accepted trade: a couple of hundred KB per
      # release accumulating quietly. The run summary below is the answer to that - the number
      # is recorded on every build, so drift is visible to anyone who looks, which is more than
      # was true before (nothing recorded it, which is how README.md's figure was wrong by 2 MB
      # for five releases). The gate that actually matters is the dependency check that follows.
      - name: Size gate
        shell: pwsh
        run: |
          $exe = 'publish-cli/winlogrotate.exe'
          if (-not (Test-Path $exe)) { throw "the AOT publish produced no $exe" }
          $mb = (Get-Item $exe).Length / 1MB
          "winlogrotate.exe = {0:N2} MB" -f $mb
          "``winlogrotate.exe`` = **{0:N2} MB** (floor 2, ceiling 16)" -f $mb |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($mb -lt 2)  { throw ("{0:N2} MB is below the floor - this looks like an apphost stub, not a native image" -f $mb) }
          if ($mb -gt 16) { throw ("{0:N2} MB is above the ceiling - something pulled in reflection" -f $mb) }

      # Turns "zero dependencies" from a claim in the README into an assertion. A native
      # image may import from OS DLLs and nothing else; an hostfxr/hostpolicy import means
      # it is not actually self-contained.
      #
      # This step used to be unable to fail in three ways, all of which end the same: a green
      # check over an import list nobody read.
      #
      #   - A missing dumpbin exited 0 with a warning annotation. Get-ChildItem over a wildcard
      #     that matches nothing returns empty without erroring, so a Visual Studio layout change
      #     on the runner image - which is what the canary job exists to warn about - silently
      #     disarmed the only place the shipped binary is ever linked.
      #   - dumpbin's own exit code was never read.
      #   - There was no floor on the parse. A localised or reformatted /DEPENDENTS listing yields
      #     an empty match set, an empty forbidden set, and a pass. Every native image imports
      #     kernel32.dll, so an empty list is proof the parse broke, not proof the image is clean.
      - name: Dependency gate
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "$env:ProgramFiles*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                     Select-Object -First 1
          if (-not $dumpbin) {
            throw ('dumpbin was not found under Visual Studio, so the self-containment of the ' +
                   'binary this job exists to link cannot be checked. Fix the path rather than ' +
                   'skipping: a gate that disarms itself is worse than no gate.')
          }

          $listing = & $dumpbin /DEPENDENTS publish-cli/winlogrotate.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin exited $LASTEXITCODE; its output cannot be trusted" }

          $imports = $listing |
                     Select-String -Pattern '^\s{4}(\S+\.dll)$' -AllMatches |
                     ForEach-Object { $_.Matches.Groups[1].Value.ToLower() }
          $imports | ForEach-Object { "imports $_" }

          # The positive control, in the spirit of the unheld-file probe further down this file:
          # if the thing that MUST be there is not found, everything below is noise. Every native
          # Windows image reaches the kernel, either directly or through the API sets - so this
          # fails on a parse that produced nothing without asserting which spelling it used.
          $core = $imports | Where-Object { $_ -eq 'kernel32.dll' -or $_ -like 'api-ms-win-core-*' }
          if (-not $core) {
            throw ("the import list names no kernel import, which every native image has - so the " +
                   "listing was not parsed and the check below would pass on nothing. " +
                   "Found: $($imports -join ', ')")
          }

          $forbidden = $imports | Where-Object { $_ -match 'hostfxr|hostpolicy|coreclr|clrjit|System\.' }
          if ($forbidden) { throw "not self-contained - imports $($forbidden -join ', ')" }

      - name: Smoke the published binary
        shell: pwsh
        run: |
          $v = & publish-cli/winlogrotate.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "--version printed '$v', expected three-part semver" }
          "version = $v"

  # Compile-only, and fast: catches a broken installer script - a bad !insertmacro, an
  # unreferenced function - within seconds of a push, on a runner that costs nothing. The stub
  # exes exist only to satisfy the File directives.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      # The /SD silent-default rule used to live here as a shell script. It is now
      # ArchitectureTests.EverySilentInstallHasADefault, because the script could not fail on an
      # input it did not understand - and because a rule that lives in `dotnet test` is one the
      # release path already runs, which a step in this job is not.

      - name: Stub the release binaries
        run: |
          : > packaging/winlogrotate.exe
          : > packaging/winlogrotate-gui.exe

      # -WX: a warning here means the script is not doing what it reads like it does.
      - name: Compile all three installers
        run: |
          makensis -WX -V2 -DVERSION=0.0.0 packaging/winlogrotate.nsi
          makensis -WX -V2 -DVERSION=0.0.0 -DFULL_ONLY packaging/winlogrotate.nsi
          makensis -WX -V2 -DVERSION=0.0.0 -DMINIMAL_ONLY packaging/winlogrotate.nsi


  # A script that compiles can still install nothing, register the wrong thing, or leave a
  # folder behind. This builds a real installer and runs the whole round trip on a throwaway
  # machine: install, verify, upgrade while a rotation is running, uninstall, reinstall, purge,
  # then the per-user path. It covers everything no unit test can reach - the Add/Remove
  # contract, the hardened ACL as actually applied, the Event Log source, the scheduled task's
  # real settings, PATH, and the upgrade waiting for a rotation in progress.
  #
  # It is the only place the INSTALLED product is exercised end to end - the installer, the
  # registered task, the hardened ACLs and the shipped binary together. Other jobs execute this
  # code on Windows too: build runs the whole test suite, which drives the CLI in-process, and
  # aot smokes the published executable.
  installer-smoke:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DATA_DIR: C:\ProgramData\WinLogRotate
      TASK_PATH: \WinLogRotate\
      TASK_NAME: Rotate
      ROTATION_MUTEX: Global\WinLogRotate.Rotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # The exact publishes the release job runs, so a packaging break is caught here rather than
      # shipping as a broken release after merge.
      - name: Publish the CLI (NativeAOT)
        run: >
          dotnet publish src/WinLogRotate.Cli/WinLogRotate.Cli.csproj -c Release -r win-x64
          -p:PublishAot=true -p:TrimmerSingleWarn=false /warnaserror -o publish-cli

      - name: Publish the GUI (framework-dependent)
        run: >
          dotnet publish src/WinLogRotate.Gui/WinLogRotate.Gui.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish-gui

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          Copy-Item publish-cli/winlogrotate.exe packaging/winlogrotate.exe -Force
          Copy-Item publish-gui/winlogrotate-gui.exe packaging/winlogrotate-gui.exe -Force
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /WX /V2 /DVERSION=9.9.9 /DMINIMAL_ONLY packaging/winlogrotate.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Move-Item packaging/WinLogRotate-Setup-9.9.9-min.exe setup.exe -Force
          "built {0:N2} MB" -f ((Get-Item setup.exe).Length / 1MB)

      # ---- Leg A: per-machine install, the default and the one that matters --------------
      - name: 'Leg A: silent per-machine install'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $pathBefore = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          # -NoNewline: a trailing newline would otherwise attach itself to the last PATH
          # entry when this is read back, and the last entry would look like it went missing.
          Set-Content machine-path-before.txt -Value $pathBefore -NoNewline

          Start-Process -FilePath (Resolve-Path setup.exe) -ArgumentList '/S','/AllUsers','/HOST=task','/NORUNTIME' -Wait

          $entry = Get-UninstallEntry -Scope machine
          if (-not $entry) { throw 'No per-machine Add/Remove entry was registered.' }
          if ($entry.DisplayVersion -ne '9.9.9') { throw "DisplayVersion is '$($entry.DisplayVersion)'." }
          if ($entry.HostKind -ne 'task') { throw "HostKind is '$($entry.HostKind)', expected task." }
          "  installed to $($entry.InstallLocation)"
          "  data dir     $($entry.DataDir)"

          foreach ($f in 'winlogrotate.exe','winlogrotate-gui.exe','uninstall.exe') {
            if (-not (Test-Path (Join-Path $entry.InstallLocation $f))) { throw "$f was not installed." }
          }
          if (-not (Test-Path "$env:DATA_DIR\config.toml")) { throw 'No seeded config.toml.' }
          if (-not (Test-Path "$env:DATA_DIR\conf.d")) { throw 'No conf.d directory.' }

      # conf.d is asserted as well as the root, and it is the one that matters: the run host
      # executes what it finds in conf.d, the root merely contains it. Checking only the root
      # is what let a release ship in which the root looked perfect and conf.d was writable by
      # the account that ran the installer, courtesy of ProgramData's inherit-only
      # CREATOR OWNER entry.
      - name: 'Leg A: the configuration directory is actually locked down'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          Assert-Sddl -Path $env:DATA_DIR
          Assert-Sddl -Path "$env:DATA_DIR\conf.d"
          Assert-Sddl -Path "$env:DATA_DIR\journal"

          # The end the ACL exists for, asserted directly rather than inferred from an SDDL
          # comparison on whichever directory somebody happened to think of.
          $entry = Get-UninstallEntry -Scope machine
          $doctor = & (Join-Path $entry.InstallLocation 'winlogrotate.exe') doctor --json | ConvertFrom-Json
          if (-not $doctor.result.hooksAllowed) {
            throw 'doctor reports hooks are refused after a clean per-machine install, which is the whole point of the ACL.'
          }

      - name: 'Leg A: Event Log source and PATH'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\WinLogRotate'
          if (-not (Test-Path $key)) {
            throw 'The Event Log source was not registered. Creating it needs admin, so it must happen at install time or the unelevated CLI throws on its first write.'
          }
          $entry = Get-UninstallEntry -Scope machine
          Assert-PathEntry -Scope Machine -Contains $entry.InstallLocation `
                           -PreservedPrefix (Get-Content machine-path-before.txt -Raw)

      # The installer treats a failed host registration as non-fatal and reports it through
      # DetailPrint, which is invisible under /S - so a silent install can report success with
      # nothing scheduled to run. Re-running the registration here surfaces whatever schtasks
      # actually said, rather than leaving us to guess from the absence of a task.
      - name: 'Leg A: the scheduled task is registered and hardened'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $exe = Join-Path $entry.InstallLocation 'winlogrotate.exe'

          if (-not (Get-ScheduledTask -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue)) {
            Write-Host '::warning::The installer did not register the task. Re-running it to capture the error.'
            & $exe host use task --verbose 2>&1 | ForEach-Object { Write-Host "    $_" }
            Write-Host "    host use task exited $LASTEXITCODE"

            Write-Host '  --- the XML we hand to schtasks ---'
            & $exe host export-task | ForEach-Object { Write-Host "    $_" }

            Write-Host '  --- schtasks, directly, with its own diagnostics ---'
            & $exe host export-task | Out-File -Encoding unicode task.xml
            & schtasks.exe /create /tn '\WinLogRotate\Rotate' /xml task.xml /f 2>&1 |
              ForEach-Object { Write-Host "    $_" }
            Write-Host "    schtasks exited $LASTEXITCODE"
          }

          Assert-TaskHardening -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME -ExpectSystem

      # The whole chain, end to end: task principal, ACL, event source and the binary itself,
      # proven by SYSTEM actually running it and leaving state behind.
      - name: 'Leg A: run it as SYSTEM and prove it did something'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $exe = Join-Path $entry.InstallLocation 'winlogrotate.exe'

          # A real job, so the run has something to do.
          New-Item -ItemType Directory -Force "C:\smoke\logs" | Out-Null
          1..5 | ForEach-Object {
            Set-Content "C:\smoke\logs\app-2026-08-0$_.log" ('x' * 20000)
            (Get-Item "C:\smoke\logs\app-2026-08-0$_.log").LastWriteTimeUtc = (Get-Date).AddDays(-$_ - 30)
          }
          Set-Content "C:\smoke\logs\app-2026-09-07.log" 'current'

          # Built from an array rather than a here-string: PowerShell requires the closing
          # '@ at column zero, which cannot coexist with YAML block indentation.
          $job = @(
            'schema = 1',
            '[job]',
            'name  = "smoke"',
            'kind  = "manage"',
            'paths = ["C:/smoke/logs/app-*.log"]',
            'compress = true',
            'rotate   = 2'
          )
          Set-Content -Path "$env:DATA_DIR\conf.d\smoke.toml" -Value $job

          # A rotate job too, because until milestone 12 nothing in CI ever ran one: both smoke
          # jobs were kind = "manage", and the rotate branch of the engine had no caller at all.
          # This is the first time the product's headline behaviour executes on real hardware.
          New-Item -ItemType Directory -Force "C:\smoke\rot" | Out-Null
          Set-Content "C:\smoke\rot\svc.log" ('y' * 4096)

          $rotate = @(
            'schema = 1',
            '[job]',
            'name  = "smoke-rotate"',
            'kind  = "rotate"',
            'paths = ["C:/smoke/rot/svc.log"]',
            'rotate   = 3',
            'compress = false',
            'notifempty = false',

            # And a real hook, run by SYSTEM out of a directory the installer locked down. Until
            # milestone 13 nothing in this product had ever spawned a bounded child process, and
            # the ACL gate that permits one was computed, printed by doctor, and gated nothing.
            # A witness file is the only way to tell "the hook ran" from "the hook was refused
            # and the run reported success anyway", which is the failure this whole area exists
            # to prevent.
            'postrotate = ["command:C:\\Windows\\System32\\cmd.exe /c echo ran> C:\\smoke\\rot\\hook-ran.txt"]'
          )
          Set-Content -Path "$env:DATA_DIR\conf.d\smoke-rotate.toml" -Value $rotate

          & $exe config check --json | Out-Host
          & $exe run --dry-run --verbose | Out-Host

          # First run baselines rather than rotating - the property that stops a fresh install
          # rotating every log on the machine at once - so --catchup is what actually rotates.
          if (Test-Path "C:\smoke\rot\svc.log.1") {
            throw 'The first run rotated instead of baselining, so a fresh install would rotate every log at once.'
          }
          if (Test-Path "C:\smoke\rot\hook-ran.txt") {
            throw 'A dry run executed the postrotate hook. --dry-run must describe a hook without running it.'
          }

          & $exe run --catchup --verbose | Out-Host

          if (-not (Test-Path "C:\smoke\rot\svc.log.1")) {
            throw 'The rotate job produced no svc.log.1, so the live log was never renamed.'
          }
          if (-not (Test-Path "C:\smoke\rot\svc.log")) {
            throw 'The live log was not recreated, so the writer would keep appending to the archive.'
          }
          if ((Get-Item "C:\smoke\rot\svc.log").Length -ne 0) {
            throw 'The recreated log is not empty, so the rename did not do what it claimed.'
          }

          # The first hook this product has ever run. It proves four things at once that no unit
          # test can: the ACL gate opened on a real installer-made directory, the process was
          # spawned by SYSTEM, its pipes were drained, and it was waited for rather than abandoned.
          if (-not (Test-Path "C:\smoke\rot\hook-ran.txt")) {
            throw 'The postrotate hook left no witness file, so it was refused or never dispatched.'
          }
          Remove-Item "C:\smoke\rot\hook-ran.txt"

          # And again: the clock has just been set, so a second run must decline.
          & $exe run --verbose | Out-Host
          if (Test-Path "C:\smoke\rot\svc.log.2") {
            throw 'A second run rotated again within the interval; the rotation clock is not being read.'
          }
          if (Test-Path "C:\smoke\rot\hook-ran.txt") {
            throw 'A run that rotated nothing still ran the hook; a reload must follow a rotation, not a schedule.'
          }

          $result = Wait-TaskResult -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME
          if ($result -ne 0) { throw "The scheduled task exited 0x$('{0:X}' -f $result)." }

          if (-not (Test-Path "$env:DATA_DIR\state.json")) {
            throw 'The SYSTEM run wrote no state file, so it did not actually get that far.'
          }
          if (-not (Test-Path "$env:DATA_DIR\journal")) {
            throw 'The SYSTEM run wrote no journal.'
          }
          "  journal:"; Get-ChildItem "$env:DATA_DIR\journal" | ForEach-Object { "    $($_.Name)" }
          & $exe journal | Select-Object -First 10 | Out-Host

      # The gate exists so a second rotation is refused rather than running over the first, and it
      # could not do that: the descriptor granted Everyone Synchronize and Modify while
      # MutexAcl.Create asked for full control, so the second caller was refused BY the lock
      # instead of being told the lock was held. Every part of that is Windows-only - the mutex,
      # the ACL, the .NET API - so this is the only place the production name and the production
      # descriptor are exercised together, through the shipped binary.
      - name: 'Leg A: a second rotation is refused, and says so'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $exe = Join-Path $entry.InstallLocation 'winlogrotate.exe'

          Invoke-WithHeldRotationGate -MutexName $env:ROTATION_MUTEX -HoldSeconds 12 -Body {
            $out = & $exe run --json --no-notify | Out-String
            $code = $LASTEXITCODE

            "  second rotation exited $code" | Out-Host

            if ($code -ne 3) {
              $out | Out-Host
              throw "Expected exit 3 because the gate was held; got $code."
            }

            $envelope = $out | ConvertFrom-Json
            if ($envelope.verb -ne 'run') { throw "Expected verb 'run'; got '$($envelope.verb)'." }
            if ($envelope.ok) { throw 'A run that did nothing reported ok = true.' }
            if ($envelope.exitCode -ne 3) { throw "Envelope said exitCode $($envelope.exitCode)." }
          }

          # Stated, not inferred. A real failure throws above and never reaches this; without it
          # the step's verdict is whatever $? and $LASTEXITCODE happen to hold, and the body ran a
          # native command that exits 3 on purpose.
          exit 0

      # LockProbe decides which strategy a rotation may use, its whole job is to answer a question
      # about a file somebody else is holding, and until milestone 14 it had never met one - on a
      # runner or in a test. Four share masks, four verdicts, through the shipped NativeAOT binary,
      # which is the only place CreateFileW is reached through a source-generated stub.
      - name: 'Leg A: the probe meets four real contended handles'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $exe = Join-Path (Get-UninstallEntry -Scope machine).InstallLocation 'winlogrotate.exe'

          New-Item -ItemType Directory -Force 'C:\smoke\lock' | Out-Null
          $log = 'C:\smoke\lock\held.log'
          Set-Content $log 'baseline'

          # The control. If an unheld file does not probe as Rename, everything below is noise.
          $free = & $exe probe $log --json | ConvertFrom-Json
          if ($free.result.verdict -ne 'Rename') { throw "An unheld file probed as $($free.result.verdict)." }
          if (-not $free.result.unlocked)        { throw 'An unheld file did not report unlocked.' }

          $cases = @(
            @{ Share = 'ReadWrite, Delete'; Verdict = 'Rename';       Suggested = 'rename' },
            @{ Share = 'ReadWrite';         Verdict = 'CopyTruncate'; Suggested = 'copytruncate' },
            @{ Share = 'Read';              Verdict = 'Copy';         Suggested = 'copy' },
            @{ Share = 'None';              Verdict = 'None';         Suggested = $null }
          )

          foreach ($c in $cases) {
            Invoke-WithHeldHandle -Path $log -Share $c.Share -While {
              $p = & $exe probe $log --json | ConvertFrom-Json
              "  share $($c.Share.PadRight(18)) -> $($p.result.verdict)"

              if ($p.result.verdict -ne $c.Verdict) {
                throw "A holder sharing '$($c.Share)' probed as '$($p.result.verdict)', expected '$($c.Verdict)'."
              }
              if ($p.result.unlocked) {
                throw 'The probe called the file unlocked while a handle was demonstrably open on it.'
              }
              $suggested = Get-JsonProperty $p.result 'suggested'
              if ($suggested -ne $c.Suggested) {
                throw "suggested is '$suggested', expected '$($c.Suggested)'."
              }
              # 32 is ERROR_SHARING_VIOLATION - the single most important error code here.
              if ($c.Verdict -ne 'Rename' -and $p.result.blockingError -ne 32) {
                throw "blockingError is $($p.result.blockingError), expected 32."
              }
            }
          }
          '  four contended handles, four verdicts'

      # lockstrategy = "auto" fell through RotateJobPlanner's discard arm and silently meant
      # rename - the one strategy a holder withholding FILE_SHARE_DELETE denies, which is exactly
      # the writer somebody picks auto to cope with. The ReadWrite and Read cases below fail
      # outright against the old code.
      - name: 'Leg A: lockstrategy = "auto" picks what the handle actually permits'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $exe = Join-Path (Get-UninstallEntry -Scope machine).InstallLocation 'winlogrotate.exe'

          $cases = @(
            @{ Name='auto-rename'; Share='ReadWrite, Delete'; Strategy='rename';       Live=0    },
            @{ Name='auto-trunc';  Share='ReadWrite';         Strategy='copytruncate'; Live=0    },
            @{ Name='auto-copy';   Share='Read';              Strategy='copy';         Live=4096 }
          )

          foreach ($c in $cases) {
            $dir = "C:\smoke\auto\$($c.Name)"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $log = Join-Path $dir 'svc.log'
            [System.IO.File]::WriteAllBytes($log, (New-Object byte[] 4096))

            @(
              'schema = 1', '[job]', "name  = `"$($c.Name)`"", 'kind  = "rotate"',
              "paths = [`"$($dir -replace '\\','/')/svc.log`"]",
              'rotate = 3', 'compress = false', 'notifempty = false', 'lockstrategy = "auto"'
            ) | Set-Content "$env:DATA_DIR\conf.d\$($c.Name).toml"

            $state = "$dir\state.json"

            Invoke-WithHeldHandle -Path $log -Share $c.Share -While {
              & $exe run --catchup --job $c.Name --state $state --no-notify --verbose | Out-Host
              $code = $LASTEXITCODE; $global:LASTEXITCODE = 0

              if ($code -ne 0) { throw "[$($c.Name)] run exited $code against a $($c.Share) holder." }
              if (-not (Test-Path "$log.1")) {
                throw ("[$($c.Name)] no svc.log.1 - auto did not resolve to $($c.Strategy), and " +
                       "almost certainly fell through to rename, which this holder denies.")
              }
              if ((Get-Item "$log.1").Length -ne 4096) { throw "[$($c.Name)] the archive is not the log." }
              if ((Get-Item $log).Length -ne $c.Live) {
                throw ("[$($c.Name)] the live log is $((Get-Item $log).Length) bytes, expected " +
                       "$($c.Live) - that is a different strategy from $($c.Strategy).")
              }
            }

            # Asserted after the handle is released, so a failure cannot leave the file locked.
            # The journal is the only place the chosen strategy is visible, and it is visible only
            # because PlanExecutor.Emit populates CliEvent.Strategy at all now.
            $applied = @((& $exe journal --job $c.Name --json | ConvertFrom-Json).result.entries |
                         Where-Object { $_.phase -eq 'apply' -and (Get-JsonProperty $_ 'src') -eq $log })
            if (@($applied | Where-Object { (Get-JsonProperty $_ 'strategy') -eq $c.Strategy }).Count -eq 0) {
              throw ("[$($c.Name)] the journal does not record strategy '$($c.Strategy)'. " +
                     'A rotation whose strategy is unrecorded cannot be audited afterwards.')
            }
            Remove-Item "$env:DATA_DIR\conf.d\$($c.Name).toml"
          }
          '  auto resolved three ways against three real handles'

      # The failure no other Windows log rotator detects, on real NTFS. The writer here stands in
      # for log4net and most C++ std::ofstream implementations: it holds its own file offset and
      # does not seek back to zero when we truncate underneath it. FileMode.Append would prove
      # nothing - FILE_APPEND_DATA always writes at the end, which is the healthy case.
      - name: 'Leg A: a real NUL-fill is detected and copytruncate is quarantined'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $exe = Join-Path (Get-UninstallEntry -Scope machine).InstallLocation 'winlogrotate.exe'

          # Not 'nul': NUL is a reserved DOS device name, along with CON, PRN, AUX, COM1-9 and
          # LPT1-9, so a directory of that name cannot exist. New-Item fails non-terminally and
          # everything after it reports a missing path instead.
          $dir = 'C:\smoke\nulfill'; $log = "$dir\app.log"; $state = "$dir\state.json"
          New-Item -ItemType Directory -Force $dir -ErrorAction Stop | Out-Null

          # 2 MiB: above NulFillDetector.MinimumInterestingSize, below which proportional
          # reasoning is noise rather than evidence.
          $size = 2MB
          [System.IO.File]::WriteAllBytes($log, (New-Object byte[] $size))

          @(
            'schema = 1', '[job]', 'name = "nulfill"', 'kind = "rotate"',
            "paths = [`"$($dir -replace '\\','/')/app.log`"]",
            'rotate = 3', 'compress = false', 'notifempty = false',
            'lockstrategy = "copytruncate"'
          ) | Set-Content "$env:DATA_DIR\conf.d\nulfill.toml"

          $writer = [System.IO.File]::Open($log, 'Open', 'Write', 'ReadWrite')
          try {
            # Where a cached-offset writer believes it is.
            $writer.Position = $size

            & $exe run --catchup --job nulfill --state $state --no-notify --verbose | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "run 1 exited $LASTEXITCODE" }
            $global:LASTEXITCODE = 0

            if ((Get-Item "$log.1").Length -ne $size) { throw 'The archive is not the log we truncated.' }
            if ((Get-Item $log).Length -ne 0)         { throw 'copytruncate did not empty the original.' }

            # RecordTruncation had no subscriber at all before this milestone, so this number was
            # computed on every truncation and thrown away every time.
            $s1 = (Get-Content $state -Raw | ConvertFrom-Json).paths.PSObject.Properties |
                  Where-Object { $_.Value.path -ieq $log } | Select-Object -First 1
            if ($null -eq $s1) { throw "The state file has no entry for '$log' after a rotation." }
            $recorded = Get-JsonProperty $s1.Value 'lastTruncatedFrom'
            if ($recorded -ne $size) {
              throw ("state records lastTruncatedFrom = '$recorded', expected $size - so " +
                     'RecordTruncation reached nothing and the detector has no baseline.')
            }

            # THE FAILURE. The rotation just emptied this file; a true append handle would resume
            # at zero. This one resumes where it remembers, and NTFS zero-fills the gap.
            $line = [System.Text.Encoding]::ASCII.GetBytes("resumed at a cached offset`r`n")
            $writer.Write($line, 0, $line.Length)
            $writer.Flush()
          } finally { $writer.Dispose() }

          $now = (Get-Item $log).Length
          if ($now -lt $size) { throw "NTFS did not zero-fill: the file is $now bytes, expected >= $size." }
          "  the log came back as {0:N0} bytes of NULs plus one line" -f $now

          # Run 2 judges the previous truncation. Deliberately not --force: the judgement is about
          # what already happened, and a detector gated on dueness quarantines a day late.
          $r2 = & $exe run --job nulfill --state $state --no-notify --json | ConvertFrom-Json
          $global:LASTEXITCODE = 0

          if ($r2.diagnostics.code -notcontains 'LR3102') {
            throw ('A 2 MiB NUL-filled file produced no LR3102. Codes: ' + ($r2.diagnostics.code -join ', '))
          }

          $s2 = (Get-Content $state -Raw | ConvertFrom-Json).paths.PSObject.Properties |
                Where-Object { $_.Value.path -ieq $log } | Select-Object -First 1
          if ($null -eq $s2) { throw "The state file has no entry for '$log'." }
          if ($s2.Value.nulFill -ne 'Confirmed') {
            throw "state records nulFill = '$($s2.Value.nulFill)', expected 'Confirmed'."
          }

          # Run 3: refused, permanently, rather than truncating again.
          & $exe run --force --job nulfill --state $state --no-notify --verbose | Out-Host
          $global:LASTEXITCODE = 0

          $applied = @((& $exe journal --job nulfill --json | ConvertFrom-Json).result.entries |
                       Where-Object { $_.phase -eq 'apply' -and (Get-JsonProperty $_ 'src') -ieq $log })
          if (@($applied | Where-Object { (Get-JsonProperty $_ 'strategy') -eq 'copytruncate' }).Count -gt 1) {
            throw 'copytruncate ran again on a path with a confirmed NUL-fill.'
          }
          '  detected, reported and quarantined'

          Remove-Item "$env:DATA_DIR\conf.d\nulfill.toml"

      # The one assertion that proves the whole event-ID design on real hardware. The installer
      # registers EventCreate.exe as the message file, which constrains every ID to 1..1000, one
      # insertion string, and category 0. Get any of those wrong and the event still appears -
      # it just renders as "The description for Event ID N ... cannot be found", which no unit
      # test can catch because it is Event Viewer doing the rendering, not us.
      # A junction needs no privilege at all to create, which is the entire reason the defence
      # exists - and until this milestone the job's own anchor was walked without ever being
      # checked, so a job pointed at one was followed wherever it led.
      #
      # Every run below is --dry-run, deliberately. The revert table for this feature requires
      # running these steps against a guard that has been switched off on purpose, and a real run
      # in that state would walk System32 as an administrator with a retention plan. A dry run
      # still reaches CheckPattern, the enumeration and the new link check - all of which happen
      # before anything consults options.DryRun.
      - name: 'Leg A: a junction to an ordinary directory is followed'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $exe = Join-Path (Get-UninstallEntry -Scope machine).InstallLocation 'winlogrotate.exe'

          New-Item -ItemType Directory -Force 'C:\smoke\real-logs' -ErrorAction Stop | Out-Null
          [System.IO.File]::WriteAllBytes('C:\smoke\real-logs\svc.log', (New-Object byte[] 4096))
          New-Item -ItemType Junction -Path 'C:\smoke\junc-ok' -Target 'C:\smoke\real-logs' -ErrorAction Stop | Out-Null

          # Proven, not assumed. A junction that silently failed to be created would make every
          # assertion below pass against an ordinary directory.
          if (-not ((Get-Item 'C:\smoke\junc-ok').Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'C:\smoke\junc-ok is not a reparse point.'
          }

          $g = & $exe glob 'C:/smoke/junc-ok/*.log' --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "glob exited $LASTEXITCODE through a benign junction." }

          if ($g.result.count -ne 1) {
            throw ("glob found $($g.result.count) file(s) through a junction to an ordinary " +
                   'directory. Relocating logs onto another volume is ordinary practice and must ' +
                   'keep working.')
          }

          $resolved = Get-JsonProperty $g.result 'resolvedAnchor'
          if (-not $resolved) { throw 'glob did not report where the anchor actually led.' }
          "  junction followed, anchor resolved to $resolved"

          # The link itself, non-recursively. Leaving a live junction under C:\smoke would make
          # any later recursive delete of that tree a delete of whatever it points at.
          (Get-Item 'C:\smoke\junc-ok').Delete()

      - name: 'Leg A: a junction into System32 is refused and names both paths'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $exe = Join-Path (Get-UninstallEntry -Scope machine).InstallLocation 'winlogrotate.exe'

          New-Item -ItemType Junction -Path 'C:\smoke\junc-bad' -Target 'C:\Windows\System32' -ErrorAction Stop | Out-Null
          if (-not ((Get-Item 'C:\smoke\junc-bad').Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'C:\smoke\junc-bad is not a reparse point.'
          }

          $before = @(Get-ChildItem 'C:\Windows\System32' -Filter *.log -ErrorAction SilentlyContinue).Count

          @(
            'schema = 1', '[job]', 'name = "junction"', 'kind = "rotate"',
            'paths = ["C:/smoke/junc-bad/*.log"]',
            'rotate = 3', 'compress = false', 'notifempty = false'
          ) | Set-Content "$env:DATA_DIR\conf.d\junction.toml"

          $r = & $exe run --dry-run --job junction --no-notify --json | ConvertFrom-Json
          $global:LASTEXITCODE = 0

          $refusals = @($r.diagnostics | Where-Object { $_.code -eq 'LR9004' })
          if ($refusals.Count -ne 1) {
            throw ("expected exactly one LR9004, got $($refusals.Count). Codes: " +
                   ($r.diagnostics.code -join ', '))
          }

          # Severity is a name on the wire. It was an integer until milestone 18, so this
          # asserted 3 and carried a comment translating it - the assertion it was always
          # trying to make, written the only way the envelope then allowed.
          if ($refusals[0].severity -ne 'Critical') {
            throw "LR9004 came back at severity $($refusals[0].severity), expected Critical."
          }

          foreach ($needle in @('junc-bad', 'System32')) {
            if ($refusals[0].message -notlike "*$needle*") {
              throw ("the refusal does not name '$needle': $($refusals[0].message). A refusal " +
                     'that does not say what was aimed where is unactionable.')
            }
          }

          # One line for one cause. "matched no files" on top would describe the consequence as
          # though it were a second, separate problem.
          if ($r.diagnostics.code -contains 'LR2002') {
            throw 'the refused pattern was also reported as matching no files.'
          }

          $after = @(Get-ChildItem 'C:\Windows\System32' -Filter *.log -ErrorAction SilentlyContinue).Count
          if ($after -ne $before) { throw "System32 changed: $before -> $after." }

          '  refused, named, and nothing behind it was touched'

          # Delete the link itself, never the tree behind it.
          (Get-Item 'C:\smoke\junc-bad').Delete()
          Remove-Item "$env:DATA_DIR\conf.d\junction.toml"

      - name: 'Leg A: the Event Log actually renders our messages'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $exe = Join-Path $entry.InstallLocation 'winlogrotate.exe'

          # A guaranteed Warning: a job pointing at a directory that is not there, with
          # missingok unset. No --json, because --json deliberately suppresses the mirroring.
          $job = @(
            'schema = 1',
            '[job]',
            'name  = "eventlog-probe"',
            'kind  = "manage"',
            'paths = ["C:/smoke/definitely-not-here/*.log"]'
          )
          Set-Content -Path "$env:DATA_DIR\conf.d\eventlog-probe.toml" -Value $job
          # This run is MEANT to fail: a failing job is how a Warning is produced, and exit 1
          # is the correct answer. pwsh propagates $LASTEXITCODE, so it has to be cleared or
          # the step fails for precisely the condition the test was arranging.
          & $exe run | Out-Host
          if ($LASTEXITCODE -ne 1) { throw "expected the probe run to exit 1, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Remove-Item "$env:DATA_DIR\conf.d\eventlog-probe.toml"

          # The Event Log is written asynchronously, so this needs a poll rather than a read.
          # Every result is wrapped in @(): Get-WinEvent returns a bare object rather than an
          # array when there is exactly one event, and the helpers run under
          # Set-StrictMode -Version Latest, where reading .Count off a scalar is an error.
          $query = @{ LogName = 'Application'; ProviderName = 'WinLogRotate' }
          Wait-Until -TimeoutSeconds 60 -Because 'an event from WinLogRotate to appear' -Condition {
            @(Get-WinEvent -ErrorAction SilentlyContinue -FilterHashtable $query).Count -gt 0
          }

          $events = @(Get-WinEvent -ErrorAction SilentlyContinue -FilterHashtable $query)

          foreach ($e in $events) {
            "  event $($e.Id) [$($e.LevelDisplayName)]: $($e.Message -split "`n" | Select-Object -First 1)"

            if ($e.Message -like '*The description for Event ID*') {
              throw ("Event ID $($e.Id) does not render. EventCreate.exe's message table covers " +
                     '1..1000 with a single insertion string and no categories - see ' +
                     'docs/diagnostics.md. An alert rule on an event that renders like this ' +
                     'is worse than no event at all.')
            }
            if ($e.Id -lt 1 -or $e.Id -gt 1000) {
              throw "Event ID $($e.Id) is outside the 1..1000 range EventCreate.exe can render."
            }
            if ($e.Id -eq 190) {
              throw ('Event 190 (LR9001) after a clean per-machine install: ' + $e.Message)
            }
          }

          if (@($events | Where-Object { $_.Id -eq 121 }).Count -eq 0) {
            throw ('Expected event 121 (a log file was missing, LR2002) from the probe job. ' +
                   'Found: ' + (($events | ForEach-Object { $_.Id }) -join ', '))
          }

      # Real DPAPI, real entropy in HKLM, real file ACLs, driven through the shipped exe. The
      # store's logic is covered on the Linux leg behind IByteProtector; this is the half that
      # can only be true or false on a real machine.
      - name: 'Leg A: secrets round-trip and are not readable by ordinary users'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $exe = Join-Path $entry.InstallLocation 'winlogrotate.exe'
          $store = Join-Path $env:DATA_DIR 'secrets.dat'

          # Piped, never as an argument: a command line is readable through Win32_Process and is
          # written into 4688 audit events. There is deliberately no --value to test.
          'hunter2-correct-horse' | & $exe secret set ci-probe
          if ($LASTEXITCODE -ne 0) { throw "secret set exited $LASTEXITCODE" }

          if (-not (Test-Path $store)) { throw "secret set wrote no store at $store" }

          # The whole point of the file. Users must not be on it at all - unlike conf.d, where
          # they are granted read on purpose so the unelevated read-only GUI works.
          $rules = (Get-Acl $store).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
          foreach ($rule in $rules) {
            if ($rule.AccessControlType -ne 'Allow') { continue }
            if ($rule.IdentityReference.Value -notin @('S-1-5-18', 'S-1-5-32-544')) {
              throw "secrets.dat grants $($rule.FileSystemRights) to $($rule.IdentityReference.Value); expected SYSTEM and Administrators only."
            }
          }
          "  secrets.dat ACL ok"

          # The entropy that makes the ciphertext machine-bound must not be world-readable
          # either - it was, for one release, because the descriptor was declared and never
          # applied.
          $key = Get-Acl 'HKLM:\SOFTWARE\WinLogRotate' -ErrorAction Stop
          foreach ($rule in $key.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])) {
            if ($rule.AccessControlType -ne 'Allow') { continue }
            if ($rule.IdentityReference.Value -notin @('S-1-5-18', 'S-1-5-32-544')) {
              throw "the machine key grants $($rule.RegistryRights) to $($rule.IdentityReference.Value)."
            }
          }
          "  machine key ACL ok"

          $list = & $exe secret list --json | ConvertFrom-Json
          if ($list.result.secrets.name -notcontains 'ci-probe') { throw 'secret list did not report ci-probe.' }

          # Length only. If this ever starts reporting anything derived from the value, that is
          # a confirmable oracle for an offline guess.
          $test = & $exe secret test ci-probe --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "secret test exited $LASTEXITCODE" }
          if ($test.result.length -ne 21) { throw "secret test reported length $($test.result.length), expected 21." }

          # The value must not appear anywhere in the file, and neither must a JSON envelope
          # ever carry it.
          if ((Get-Content $store -Raw) -match 'hunter2') { throw 'the plaintext is in secrets.dat.' }
          if (($list | ConvertTo-Json -Depth 8) -match 'hunter2') { throw 'the plaintext is in the list envelope.' }

          & $exe secret remove ci-probe
          if ($LASTEXITCODE -ne 0) { throw "secret remove exited $LASTEXITCODE" }
          & $exe secret test ci-probe 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'secret test still succeeds after remove.' }
          $global:LASTEXITCODE = 0

      # ---- Leg B: the upgrade waits for a rotation in progress -----------------------------
      #
      # A floor AND a ceiling. Finishing immediately means the installer never took the mutex;
      # taking far longer means it sat out its own timeout and pushed through anyway. Only the
      # window between the two proves it waited for exactly as long as the rotation held.
      - name: 'Leg B: an upgrade waits for a running rotation'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $before = (Get-UninstallEntry -Scope machine).InstallLocation

          $seconds = Measure-MutexHeldUpgrade -MutexName $env:ROTATION_MUTEX `
            -Setup (Resolve-Path setup.exe) -Arguments @('/S','/NORUNTIME') -HoldSeconds 20

          "  upgrade took {0:N1}s" -f $seconds
          if ($seconds -lt 12) { throw "The upgrade finished in ${seconds}s - it did not wait for the rotation mutex." }
          if ($seconds -gt 90) { throw "The upgrade took ${seconds}s - that is the timeout path, not the mutex." }

          $entry = Get-UninstallEntry -Scope machine
          if ($entry.InstallLocation -ne $before) { throw 'The upgrade relocated the install.' }
          if (Get-UninstallEntry -Scope user) { throw 'Upgrading a per-machine install registered a per-user entry too.' }
          if (-not (Test-Path "$env:DATA_DIR\conf.d\smoke.toml")) { throw 'The upgrade destroyed the configuration.' }
          Assert-Sddl -Path $env:DATA_DIR
          Assert-TaskHardening -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME -ExpectSystem
          Assert-PathEntry -Scope Machine -Contains $entry.InstallLocation

      # ---- Leg C: uninstall keeps the customer's data -------------------------------------
      - name: 'Leg C: silent uninstall keeps configuration and history'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $entry = Get-UninstallEntry -Scope machine
          $install = $entry.InstallLocation

          Start-Process -FilePath (Join-Path $install 'uninstall.exe') -ArgumentList '/S'
          Wait-Removed -Scope machine -Directory $install

          if (Get-ScheduledTask -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue) {
            throw 'The scheduled task survived the uninstall; it would fire daily against a missing exe.'
          }
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\WinLogRotate') {
            throw 'The Event Log source survived the uninstall.'
          }
          Assert-PathEntry -Scope Machine -NotContains $install `
                           -PreservedPrefix (Get-Content machine-path-before.txt -Raw)

          # The point of this leg. A silent uninstall is what an in-place upgrade runs, so
          # deleting the customer's jobs here would be catastrophic and silent.
          if (-not (Test-Path "$env:DATA_DIR\conf.d\smoke.toml")) {
            throw 'A silent uninstall deleted the configuration. The /SD default on that prompt is wrong.'
          }
          '  configuration and history preserved'

      # ---- Leg D: and /PURGEDATA really does remove it -------------------------------------
      - name: 'Leg D: reinstall, then uninstall with /PURGEDATA'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          Start-Process -FilePath (Resolve-Path setup.exe) -ArgumentList '/S','/AllUsers','/HOST=none','/NORUNTIME' -Wait

          $entry = Get-UninstallEntry -Scope machine
          if (-not (Test-Path "$env:DATA_DIR\conf.d\smoke.toml")) {
            throw 'The reinstall did not pick up the retained configuration.'
          }
          if ($entry.HostKind -ne 'none') { throw "HostKind is '$($entry.HostKind)', expected none." }
          if (Get-ScheduledTask -TaskPath $env:TASK_PATH -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue) {
            throw '/HOST=none still registered a scheduled task.'
          }

          Start-Process -FilePath (Join-Path $entry.InstallLocation 'uninstall.exe') -ArgumentList '/S','/PURGEDATA'
          Wait-Removed -Scope machine -Directory $entry.InstallLocation
          Wait-Until -Because '/PURGEDATA to remove the data directory' -Condition {
            -not (Test-Path $env:DATA_DIR)
          }
          '  data purged on request'

      # ---- Leg E: per-user must touch nothing machine-wide --------------------------------
      - name: 'Leg E: per-user install stays out of the machine'
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $machineBefore = [Environment]::GetEnvironmentVariable('PATH', 'Machine')

          Start-Process -FilePath (Resolve-Path setup.exe) -ArgumentList '/S','/CurrentUser','/HOST=none','/NORUNTIME' -Wait

          $entry = Get-UninstallEntry -Scope user
          if (-not $entry) { throw 'No per-user Add/Remove entry was registered.' }
          if (Get-UninstallEntry -Scope machine) { throw 'A per-user install registered a per-machine entry too.' }

          $expected = Join-Path $env:LOCALAPPDATA 'Programs\WinLogRotate'
          if ($entry.InstallLocation -ne $expected) { throw "Installed to '$($entry.InstallLocation)', expected '$expected'." }
          if ($entry.DataDir -ne (Join-Path $env:APPDATA 'WinLogRotate')) { throw "DataDir is '$($entry.DataDir)'." }

          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\WinLogRotate') {
            throw 'A per-user install registered a machine-wide Event Log source.'
          }
          if ([Environment]::GetEnvironmentVariable('PATH', 'Machine') -ne $machineBefore) {
            throw 'A per-user install modified the machine PATH.'
          }

          Start-Process -FilePath (Join-Path $entry.InstallLocation 'uninstall.exe') -ArgumentList '/S','/PURGEDATA'
          Wait-Removed -Scope user -Directory $entry.InstallLocation
          if ([Environment]::GetEnvironmentVariable('PATH', 'Machine') -ne $machineBefore) {
            throw 'A per-user uninstall modified the machine PATH.'
          }
          '  per-user install left the machine untouched'

  # Weekly, allowed to fail: tells us the runner image is about to change under us without
  # turning a Tuesday push red. When this goes red, bump the pinned label deliberately.
  #
  # It said "weekly" for nine releases with no schedule trigger anywhere, and ran on every push
  # instead. The schedule above is the one it was always describing. Nothing may depend on this
  # job: continue-on-error means a dependent runs even when it fails.
  runner-canary:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build WinLogRotate.slnx -c Release

  # Computes the next tag, and runs only when a release could follow. The event allow-list is
  # load-bearing rather than decorative: this workflow now also fires on pull_request and on a
  # schedule, and on a scheduled run github.ref is still refs/heads/main - so a branch check alone
  # would let the weekly canary cut a release.
  version:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, linux-typecheck, aot, installer, installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version from Conventional Commits
        id: bump
        shell: bash
        env:
          FORCED_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$latest" ]; then
            range="${latest}..HEAD"; cur="${latest#v}"
          else
            range="HEAD"; cur="0.0.0"
          fi

          bump=none
          if [ -n "${FORCED_BUMP:-}" ]; then
            case "$FORCED_BUMP" in
              patch|minor|major) bump="$FORCED_BUMP" ;;
              none) bump=none ;;
              *) echo "::error::Unsupported bump '$FORCED_BUMP'"; exit 1 ;;
            esac
          else
            # Type prefixes are matched against SUBJECTS only. A body line quoting "fix: ..." -
            # a revert, a changelog paste - must not cut a release. The BREAKING CHANGE footer
            # lives in the body by definition, so that one grep scans full messages.
            subjects=$(git log --format='%s' "$range")
            bodies=$(git log --format='%B' "$range")

            if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
              bump=major
            elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then bump=minor
            elif grep -qE '^fix(\([^)]+\))?:'  <<<"$subjects"; then bump=patch
            fi
          fi

          echo "Latest tag: ${latest:-<none>}   bump: $bump"

          if [ "$bump" = none ]; then
            echo "No release-worthy commits since ${latest:-start}."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r MA MI PA <<<"$cur"
          # The parsed version is interpolated into pwsh below, so refuse anything that is not
          # three plain numbers.
          if ! [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then
            echo "::error::Version '$cur' from tag '${latest:-<none>}' is not numeric; refusing."
            exit 1
          fi
          case "$bump" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          echo "new_tag=v${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"
          echo "new_version=${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"

  # Publishes. Named for what it does, because the workflow it used to live in is gone.
  #
  # needs is the whole point of the merge: every gate above must have passed before anything is
  # tagged or uploaded. runner-canary is deliberately absent - it is continue-on-error, so a
  # dependent job runs even when it fails, and a dependency that cannot hold anything back is
  # exactly the kind of check this milestone exists to remove.
  #
  # There is no status function in the `if:` below, and there must not be: any of always(),
  # failure(), cancelled() or success() replaces the implicit "every need succeeded" and would
  # quietly restore the behaviour this commit removes.
  release:
    needs: [version, build, linux-typecheck, aot, installer, installer-smoke]
    if: needs.version.outputs.new_tag != ''
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # The CLI is NativeAOT, so it is self-contained in every variant. That is the whole
      # architectural payoff: the half that runs unattended as SYSTEM on a bare server has no
      # runtime dependency at all, whichever installer the operator chose.
      - name: Publish the CLI (NativeAOT)
        run: >
          dotnet publish src/WinLogRotate.Cli/WinLogRotate.Cli.csproj -c Release -r win-x64
          -p:PublishAot=true -p:TrimmerSingleWarn=false /warnaserror
          -p:Version=${{ needs.version.outputs.new_version }}
          -o publish-cli

      # Self-contained GUI: needs nothing installed. WinForms cannot be trimmed - Microsoft
      # disabled it in the SDK - so this stays large no matter what.
      - name: Publish the GUI (self-contained)
        run: >
          dotnet publish src/WinLogRotate.Gui/WinLogRotate.Gui.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.new_version }}
          -o publish-gui-full

      # Framework-dependent GUI: ~200 KB, because WinForms lives inside the Desktop Runtime.
      - name: Publish the GUI (framework-dependent)
        run: >
          dotnet publish src/WinLogRotate.Gui/WinLogRotate.Gui.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.new_version }}
          -o publish-gui-min

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build all three installers
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $version = "${{ needs.version.outputs.new_version }}"

          Copy-Item publish-cli/winlogrotate.exe packaging/winlogrotate.exe -Force
          Copy-Item publish-gui-full/winlogrotate-gui.exe packaging/winlogrotate-gui.exe -Force

          Push-Location packaging
          foreach ($define in '', '/DFULL_ONLY') {
            $args = @('/WX', '/V2', "/DVERSION=$version")
            if ($define) { $args += $define }
            $args += 'winlogrotate.nsi'
            & $makensis @args
            if ($LASTEXITCODE -ne 0) { throw "makensis $define failed with $LASTEXITCODE" }
          }

          # The minimal installer carries the framework-dependent GUI instead.
          Copy-Item ../publish-gui-min/winlogrotate-gui.exe winlogrotate-gui.exe -Force
          & $makensis /WX /V2 "/DVERSION=$version" /DMINIMAL_ONLY winlogrotate.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis /DMINIMAL_ONLY failed with $LASTEXITCODE" }
          Pop-Location

          Move-Item packaging/WinLogRotate-Setup-*.exe . -Force
          foreach ($suffix in '', '-full', '-min') {
            $file = "WinLogRotate-Setup-$version$suffix.exe"
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }
          Get-ChildItem WinLogRotate-Setup-*.exe |
            ForEach-Object { "built {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Stage and zip the portable builds
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.new_version }}"
          New-Item -ItemType Directory portable-full, portable-min | Out-Null
          Copy-Item publish-cli/winlogrotate.exe portable-full/
          Copy-Item publish-gui-full/winlogrotate-gui.exe portable-full/
          Copy-Item LICENSE portable-full/LICENSE.txt
          Copy-Item publish-cli/winlogrotate.exe portable-min/
          Copy-Item publish-gui-min/winlogrotate-gui.exe portable-min/
          Copy-Item LICENSE portable-min/LICENSE.txt

          Compress-Archive -Path portable-full/* -DestinationPath "WinLogRotate-$v.zip" -Force
          Compress-Archive -Path portable-min/*  -DestinationPath "WinLogRotate-$v-min.zip" -Force

          Get-FileHash "WinLogRotate-Setup-$v.exe", "WinLogRotate-Setup-$v-full.exe",
                       "WinLogRotate-Setup-$v-min.exe", "WinLogRotate-$v.zip",
                       "WinLogRotate-$v-min.zip" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          # Pin the tag to the commit this job built. Without it the API tags the default
          # branch's HEAD at publish time, so a push landing mid-build gets the tag - pointing
          # at code these binaries do not contain - and the queued run for that push then sees
          # no commits past the tag and silently releases nothing.
          target_commitish: ${{ github.sha }}
          files: |
            WinLogRotate-Setup-${{ needs.version.outputs.new_version }}.exe
            WinLogRotate-Setup-${{ needs.version.outputs.new_version }}-full.exe
            WinLogRotate-Setup-${{ needs.version.outputs.new_version }}-min.exe
            WinLogRotate-${{ needs.version.outputs.new_version }}.zip
            WinLogRotate-${{ needs.version.outputs.new_version }}-min.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **WinLogRotate ${{ needs.version.outputs.new_tag }}** - log rotation for Windows.

            The command-line engine is a NativeAOT binary with **no dependencies at all**, in
            every download below. Only the graphical console needs the .NET runtime, and only
            in the `-min` builds.

            | Installer | Download | Needs anything installed? |
            | --- | --- | --- |
            | **`WinLogRotate-Setup-${{ needs.version.outputs.new_version }}-full.exe`** | large | **No** - everything is inside. |
            | **`WinLogRotate-Setup-${{ needs.version.outputs.new_version }}-min.exe`** | small | Only for the GUI: the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0), fetched for you if missing. |
            | **`WinLogRotate-Setup-${{ needs.version.outputs.new_version }}.exe`** | large | Asks which of the two to install. |

            | Portable | Download | Needs anything installed? |
            | --- | --- | --- |
            | **`WinLogRotate-${{ needs.version.outputs.new_version }}.zip`** | large | **No.** Unzip and run. |
            | **`WinLogRotate-${{ needs.version.outputs.new_version }}-min.zip`** | small | Only for the GUI. |

            Installing per-machine registers a scheduled task that runs as SYSTEM and locks down
            the configuration directory so no ordinary user can drop a job file into it. Run
            `winlogrotate doctor` afterwards to see every path, permission and schedule in one
            place.

            Windows may mark a downloaded file as blocked - if an exe will not start,
            right-click it (or the zip) and choose **Properties -> Unblock**. `SHA256SUMS.txt`
            holds checksums for every download.
